# 发布构建：推送 v* 标签后在 macOS（通用包）与 Windows 上构建，生成带签名的更新包与 latest.json，
# 先上传到同名的 GitHub Release 草稿；两个平台都构建成功后，按提交生成更新说明并正式发布，
# 已安装的版本随即检查到更新。任一平台失败则停在草稿，不会发布不完整的版本。
# 流程与需要的 Secrets / Variables 见 docs/decisions.md 第 10 节。
#
# 应用检查更新时读取固定标签 updater 的 Release（预发布，不会成为 latest）中的 latest.json，每次发布后覆盖它：
# 下载中转站只接受 releases/download/<标签>/<文件> 形式的地址，不接受 releases/latest/download。
#
# 草稿在构建前单独创建，只指定标签、不指定目标提交：如果由 tauri-action 在构建结束时创建，它会把标签所在的提交
# 作为目标提交，而构建期间 main 一旦有新提交，GitHub 就要求 GITHUB_TOKEN 无法获得的 workflows 权限，创建失败。
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: 创建草稿 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view updater > /dev/null 2>&1; then
            echo "::error::缺少固定标签 updater 的 Release，创建方法见 docs/decisions.md 第 10 节"
            exit 1
          fi
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 && exit 0 # 重跑时已经存在
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Writer $GITHUB_REF_NAME" --notes "正在构建，完成后自动填写更新说明。"

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: 标签与版本号一致
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for version in \
            "$(node -p "require('./package.json').version")" \
            "$(node -p "require('./src-tauri/tauri.conf.json').version")" \
            "$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)"; do
            if [ "$version" != "$tag" ]; then
              echo "::error::标签 $GITHUB_REF_NAME 与版本号 $version 不一致（package.json、tauri.conf.json、Cargo.toml）"
              exit 1
            fi
          done

      - name: 更新公钥已配置
        shell: bash
        env:
          PUBKEY: ${{ vars.WRITER_UPDATE_PUBKEY }}
          PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$PUBKEY" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "::error::缺少 Variable WRITER_UPDATE_PUBKEY 或 Secret TAURI_SIGNING_PRIVATE_KEY"
            exit 1
          fi

      # Tauri CLI 签名更新包时核对私钥与 plugins > updater > pubkey 是否成对，公钥只在构建时写入。
      - name: 写入更新公钥
        shell: bash
        env:
          PUBKEY: ${{ vars.WRITER_UPDATE_PUBKEY }}
        run: |
          node -e '
            const fs = require("fs")
            const file = "src-tauri/tauri.release.conf.json"
            const config = JSON.parse(fs.readFileSync(file, "utf8"))
            config.plugins = { updater: { pubkey: process.env.PUBKEY.trim() } }
            fs.writeFileSync(file, JSON.stringify(config, null, 2))
          '

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WRITER_UPDATE_ENDPOINT: https://github.com/${{ github.repository }}/releases/download/updater/latest.json
          # 下载中转站（更换时只改这里），{encoded_url} 为编码后的 GitHub 地址，见 src-tauri/src/updater.rs。
          WRITER_UPDATE_MIRROR: https://download.githubcdn.com/?url={encoded_url}
          WRITER_UPDATE_PUBKEY: ${{ vars.WRITER_UPDATE_PUBKEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Writer ${{ github.ref_name }}
          releaseBody: 正在构建，完成后自动填写更新说明。
          releaseDraft: true
          includeUpdaterJson: true
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 生成更新说明并发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md --draft=false --latest

      - name: 更新检查地址指向新版本
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern latest.json
          gh release upload updater latest.json --clobber
