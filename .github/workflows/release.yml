# 发布构建：推送 v* 标签后在 macOS（通用包）与 Windows 上构建，生成带签名的更新包与 latest.json，
# 先上传到同名的 GitHub Release 草稿；两个平台都构建成功后，按提交生成更新说明并正式发布，
# 已安装的版本随即检查到更新。任一平台失败则停在草稿，不会发布不完整的版本。
# 流程与需要的 Secrets / Variables 见 docs/decisions.md 第 10 节。
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: 标签与版本号一致
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for version in \
            "$(node -p "require('./package.json').version")" \
            "$(node -p "require('./src-tauri/tauri.conf.json').version")" \
            "$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)"; do
            if [ "$version" != "$tag" ]; then
              echo "::error::标签 $GITHUB_REF_NAME 与版本号 $version 不一致（package.json、tauri.conf.json、Cargo.toml）"
              exit 1
            fi
          done

      - name: 更新公钥已配置
        shell: bash
        env:
          PUBKEY: ${{ vars.WRITER_UPDATE_PUBKEY }}
          PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$PUBKEY" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "::error::缺少 Variable WRITER_UPDATE_PUBKEY 或 Secret TAURI_SIGNING_PRIVATE_KEY"
            exit 1
          fi

      # Tauri CLI 签名更新包时核对私钥与 plugins > updater > pubkey 是否成对，公钥只在构建时写入。
      - name: 写入更新公钥
        shell: bash
        env:
          PUBKEY: ${{ vars.WRITER_UPDATE_PUBKEY }}
        run: |
          node -e '
            const fs = require("fs")
            const file = "src-tauri/tauri.release.conf.json"
            const config = JSON.parse(fs.readFileSync(file, "utf8"))
            config.plugins = { updater: { pubkey: process.env.PUBKEY.trim() } }
            fs.writeFileSync(file, JSON.stringify(config, null, 2))
          '

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WRITER_UPDATE_ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
          WRITER_UPDATE_PUBKEY: ${{ vars.WRITER_UPDATE_PUBKEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Writer ${{ github.ref_name }}
          releaseBody: 正在构建，完成后自动填写更新说明。
          releaseDraft: true
          includeUpdaterJson: true
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 生成更新说明并发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md --draft=false --latest
