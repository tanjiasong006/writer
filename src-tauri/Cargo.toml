[package]
name = "writer"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "writer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tauri-plugin-dialog = "2"
pulldown-cmark = { version = "0.13", default-features = false }
docx-rs = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
typst = "0.15"
typst-pdf = "0.15"
typst-kit = { version = "0.15", default-features = false, features = ["scan-fonts", "embedded-fonts"] }
typst-layout = "0.15"
typst-svg = "0.15"
comemo = "0.5"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tauri-plugin-updater = "2"
mitex = "0.2"
typst-render = "0.15"

# 开发版也优化图片解码与排版的热点依赖，避免图文 PDF 导出被无优化构建拖慢。
# Writer 自身保留默认开发配置与调试断言；这些设置不改变 release 配置。
[profile.dev.package.image]
opt-level = 2

[profile.dev.package.zune-jpeg]
opt-level = 2

[profile.dev.package.typst-layout]
opt-level = 2

[profile.dev.package.typst-library]
opt-level = 2

[profile.dev.package.krilla]
opt-level = 2

[profile.dev.package.png]
opt-level = 2

[patch.crates-io]
# PNG 逐行预测的无损编码补丁，范围及升级方式见 vendor/krilla/WRITER-PATCH.md。
krilla = { path = "vendor/krilla" }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# unwind：第三方排版库（Typst、docx-rs）遇到异常输入 panic 时，只让本次导出失败，
# 而不是让整个应用退出（见 docs/decisions.md 第 7 节）。
panic = "unwind"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
# 直接验证本地 krilla 补丁的过滤数据与 PDF DecodeParms。
png = "0.18.1"
pdf-writer = "0.15"
